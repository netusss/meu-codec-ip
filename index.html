<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Codec Ultra-Light</title>
    <style>
        body { background: #0c0e14; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .panel { max-width: 400px; margin: auto; background: #161a26; padding: 20px; border-radius: 8px; border: 2px solid #00f2fe; }
        .status { background: #3b82f6; padding: 10px; border-radius: 20px; font-weight: bold; font-size: 14px; margin: 15px 0; }
        button { width: 100%; padding: 15px; background: #10b981; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="panel">
        <h2>🎙️ MATRIX LIGHT</h2>
        <div class="status" id="status">ATIVANDO MICROFONE...</div>
        <button onclick="conectarCanalImediato()">⚡ ENTRAR NO AR AGORA</button>
    </div>

    <audio id="audioRemoto" autoplay playsinline></audio>

    <script>
        let stream, pc;
        const status = document.getElementById('status');
        const canalUnico = "canal_broadcast_99"; // Canal fixo privado de vocês

        async function iniciar() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                status.innerText = "PRONTO PARA CONECTAR";
            } catch (e) { status.innerText = "ERRO: CAIXA DE SOM/MICROFONE"; }
        }
        window.onload = iniciar;

        async function conectarCanalImediato() {
            status.innerText = "SINTONIZANDO LINHA...";
            
            pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            stream.getTracks().forEach(t => pc.addTrack(t, stream));
            
            pc.ontrack = e => {
                document.getElementById('audioRemoto').srcObject = e.streams[0];
                status.innerText = "🟢 NO AR / CONECTADO";
                status.style.background = "#00ff66";
                status.style.color = "#000";
            };

            const linkSinal = `https://kv-relay.deno.dev/${canalUnico}`;

            // Verifica se já existe uma oferta da outra ponta no ar
            const checar = await fetch(linkSinal).then(r => r.json()).catch(() => null);

            if (checar && checar.sdp && checar.type === 'offer') {
                await pc.setRemoteDescription(new RTCSessionDescription(checar));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                await fetch(linkSinal, { method: 'POST', body: JSON.stringify(pc.localDescription) });
            } else {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                await fetch(linkSinal, { method: 'POST', body: JSON.stringify(pc.localDescription) });
                
                // Aguarda a resposta HTTP da outra ponta de forma limpa
                const aguardarResposta = setInterval(async () => {
                    const res = await fetch(linkSinal).then(r => r.json()).catch(() => null);
                    if (res && res.type === 'answer') {
                        clearInterval(aguardarResposta);
                        await pc.setRemoteDescription(new RTCSessionDescription(res));
                    }
                }, 1500);
            }
        }
    </script>
</body>
</html>
