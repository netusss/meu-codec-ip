<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codec IP Matrix - Premium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0c0e14; color: #e2e8f0; padding: 15px; }
        .codec-panel { max-width: 500px; margin: 20px auto; background-color: #161a26; border-radius: 12px; border: 2px solid #00f2fe; box-shadow: 0 0 25px rgba(0, 242, 254, 0.2); padding: 25px; transition: all 0.5s ease; }
        .connected-flash { border-color: #00ff66 !important; box-shadow: 0 0 35px rgba(0, 255, 102, 0.4) !important; }
        h1 { font-size: 20px; text-align: center; color: #fff; margin-bottom: 5px; letter-spacing: 1px; text-transform: uppercase; }
        .status-badge { display: inline-block; background-color: #3b82f6; color: #fff; padding: 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 20px; text-align: center; width: 100%; text-transform: uppercase; }
        .vu-modulation-wrapper { background-color: #0d1017; padding: 15px; border-radius: 8px; border: 1px solid #22293a; margin-bottom: 20px; }
        .vu-led-container { display: flex; justify-content: space-between; gap: 3px; height: 24px; background-color: #05070a; padding: 4px; border-radius: 4px; }
        .led { flex: 1; height: 100%; background-color: #1e293b; border-radius: 1px; }
        .led.green-on { background-color: #00ff66; box-shadow: 0 0 8px #00ff66; }
        .led.yellow-on { background-color: #ffcc00; box-shadow: 0 0 8px #ffcc00; }
        .led.red-on { background-color: #ff3333; box-shadow: 0 0 8px #ff3333; }
        .config-section { background-color: #0d1017; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #22293a; text-align: center; }
        input { width: 100%; background-color: #161a26; border: 1px solid #334155; color: #00f2fe; padding: 12px; border-radius: 6px; font-size: 18px; outline: none; margin-top: 5px; text-align: center; font-weight: bold; }
        .btn-action { width: 100%; padding: 16px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-green { background-color: #10b981; color: #fff; }
        .btn-unmute { background-color: #f59e0b; color: #000; margin-top: 10px; display: none; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }
    </style>
</head>
<body>

    <div class="codec-panel" id="panelPrincipal">
        <h1>🎙️ MATRIX LIVE CODEC v3</h1>
        <div class="status-badge" id="statusLabel">INICIALIZANDO AUDIO...</div>

        <div class="vu-modulation-wrapper">
            <div class="vu-led-container">
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
            </div>
        </div>

        <div class="config-section">
            <label style="font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: bold;">IDENTIFICAÇÃO DO LINK:</label>
            <input type="text" id="roomInput" value="reportagem-ao-vivo">
        </div>

        <button class="btn-action btn-green" id="btnConectar" onclick="conectarLinhaDireta()">⚡ ENTRAR NO AR AGORA</button>
        <button class="btn-action btn-unmute" id="btnUnmute" onclick="forcarAudioRemoto()">🔊 ATIVAR ESCUTA (RETORNO)</button>
    </div>

    <audio id="remoteAudio" autoplay playsinline></audio>

    <script>
        let localStream, pc, ws, audioContext, analyser;
        const leds = document.querySelectorAll('.led');
        const statusLabel = document.getElementById('statusLabel');
        const roomInput = document.getElementById('roomInput');
        const panelPrincipal = document.getElementById('panelPrincipal');
        const btnUnmute = document.getElementById('btnUnmute');
        const remoteAudio = document.getElementById('remoteAudio');

        const iceConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' }
            ]
        };

        // BIP sonoro de aviso de conexão estabelecida
        function tocarBipeAlerta() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.value = 600; // Frequência do bipe
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3); // Duração de 300ms
            } catch(e) {}
        }

        async function autoStart() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true }
                });

                statusLabel.innerText = "PRONTO PARA TRANSMISSÃO";
                statusLabel.style.backgroundColor = "#3b82f6";

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(localStream);
                analyser.fftSize = 64;
                source.connect(analyser);
                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function rodarVU() {
                    if (!localStream) return;
                    requestAnimationFrame(rodarVU);
                    analyser.getByteFrequencyData(dataArray);
                    let soma = 0;
                    for (let i = 0; i < dataArray.length; i++) { soma += dataArray[i]; }
                    let volume = soma / dataArray.length;
                    let numLeds = Math.min(20, Math.round((volume / 120) * 20));

                    leds.forEach((led, index) => {
                        led.className = 'led';
                        if (index < numLeds && volume > 3) {
                            if (index <= 12) led.classList.add('green-on');
                            else if (index <= 16) led.classList.add('yellow-on');
                            else led.classList.add('red-on');
                        }
                    });
                }
                rodarVU();
            } catch (err) {
                statusLabel.innerText = "ERRO: PERMISSÃO NEGADA";
                statusLabel.style.backgroundColor = "#ff3333";
            }
        }
        window.onload = autoStart;

        function conectarLinhaDireta() {
            const sala = roomInput.value.trim();
            statusLabel.innerText = "SINALIZANDO PORTAS...";
            statusLabel.style.backgroundColor = "#f59e0b";

            // Nova rota estável livre de cache público
            ws = new WebSocket(`wss://connect.websocket.in/v3/${sala}?api_key=oCdC2zZGjpxGVm3WM716GvN2SMrw7asA7qfSsmYI`);

            ws.onopen = () => {
                statusLabel.innerText = "AGUARDANDO O OUTRO PAR...";
                statusLabel.style.backgroundColor = "#10b981";
                configurarWebRTC(true);
            };

            ws.onmessage = async (event) => {
                const message = JSON.parse(event.data);

                if (message.sdp) {
                    await pc.setRemoteDescription(new RTCSessionDescription(message.sdp));
                    if (pc.remoteDescription.type === 'offer') {
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        ws.send(JSON.stringify({ sdp: pc.localDescription }));
                    }
                } else if (message.candidate) {
                    try {
                        await pc.addIceCandidate(new RTCIceCandidate(message.candidate));
                    } catch (e) {}
                }
            };
        }

        function configurarWebRTC(criarOferta) {
            if (pc) pc.close();
            pc = new RTCPeerConnection(iceConfig);

            pc.onicecandidate = event => {
                if (event.candidate) ws.send(JSON.stringify({ candidate: event.candidate }));
            };

            // GATILHO CRUCIAL: QUANDO O ÁUDIO REALMENTE CONECTA
            pc.ontrack = event => {
                remoteAudio.srcObject = event.streams[0];
                
                // 1. Mudança Visual Radical (Aviso que conectou)
                statusLabel.innerText = "🔴 CONECTADO / NO AR";
                statusLabel.style.backgroundColor = "#00ff66";
                statusLabel.style.color = "#000";
                panelPrincipal.classList.add("connected-flash");

                // 2. Alerta Sonoro
                tocarBipeAlerta();

                // 3. Ativa botão de segurança contra travas do navegador
                btnUnmute.style.display = "block";
            };

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            if (criarOferta) {
                pc.onnegotiationneeded = async () => {
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    ws.send(JSON.stringify({ sdp: pc.localDescription }));
                };
            }
        }

        // Função de clique físico para forçar a saída do som no celular se o navegador bloquear
        function forcarAudioRemoto() {
            if (remoteAudio) {
                remoteAudio.play().then(() => {
                    btnUnmute.style.display = "none"; // Esconde o botão se o som liberar
                    statusLabel.innerText = "🔴 CONECTADO / ESCUTA ATIVA";
                }).catch(e => {
                    alert("Dica: Verifique se o volume de mídia do celular não está zerado!");
                });
            }
        }
    </script>
</body>
</html>
