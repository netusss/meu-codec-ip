<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codec IP Matrix - Sistema P2P Direto</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0c0e14; color: #e2e8f0; padding: 15px; }
        .codec-panel { max-width: 500px; margin: 20px auto; background-color: #161a26; border-radius: 12px; border: 2px solid #00f2fe; box-shadow: 0 0 25px rgba(0, 242, 254, 0.2); padding: 25px; }
        h1 { font-size: 20px; text-align: center; color: #fff; margin-bottom: 5px; letter-spacing: 1px; text-transform: uppercase; }
        .status-badge { display: inline-block; background-color: #3b82f6; color: #fff; padding: 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 20px; text-align: center; width: 100%; text-transform: uppercase; }
        .vu-modulation-wrapper { background-color: #0d1017; padding: 15px; border-radius: 8px; border: 1px solid #22293a; margin-bottom: 20px; }
        .vu-led-container { display: flex; justify-content: space-between; gap: 3px; height: 24px; background-color: #05070a; padding: 4px; border-radius: 4px; }
        .led { flex: 1; height: 100%; background-color: #1e293b; border-radius: 1px; }
        .led.green-on { background-color: #00ff66; box-shadow: 0 0 8px #00ff66; }
        .led.yellow-on { background-color: #ffcc00; box-shadow: 0 0 8px #ffcc00; }
        .led.red-on { background-color: #ff3333; box-shadow: 0 0 8px #ff3333; }
        .config-section { background-color: #0d1017; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #22293a; text-align: center; }
        input { width: 100%; background-color: #161a26; border: 1px solid #334155; color: #00f2fe; padding: 12px; border-radius: 6px; font-size: 22px; outline: none; margin-top: 5px; text-align: center; font-weight: bold; font-family: monospace; letter-spacing: 3px; }
        .btn-action { width: 100%; padding: 16px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-green { background-color: #00ff66; color: #000; }
    </style>
</head>
<body>

    <div class="codec-panel">
        <h1>🎙️ MATRIX LIVE CODEC</h1>
        <div class="status-badge" id="statusLabel">CONFIGURANDO AUDIO...</div>

        <div class="vu-modulation-wrapper">
            <div class="vu-led-container">
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
            </div>
        </div>

        <div class="config-section">
            <label style="font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: bold;">CÓDIGO DO CANAL (DÍGITOS):</label>
            <input type="number" id="canalInput" pattern="[0-9]*" inputmode="numeric" value="105">
        </div>

        <button class="btn-action btn-green" id="btnConectar" onclick="conectarCanalEstudio()">⚡ ENTRAR NO AR AGORA</button>
    </div>

    <audio id="remoteAudio" autoplay playsinline></audio>

    <script>
        let localStream, pc, audioContext, analyser;
        const leds = document.querySelectorAll('.led');
        const statusLabel = document.getElementById('statusLabel');
        const canalInput = document.getElementById('canalInput');

        // Inicialização automática do microfone e VU
        async function iniciarSistema() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });

                statusLabel.innerText = "PRONTO PARA TRANSMISSÃO";
                statusLabel.style.backgroundColor = "#3b82f6";

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(localStream);
                analyser.fftSize = 64;
                source.connect(analyser);
                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function rodarVU() {
                    if (!localStream) return;
                    requestAnimationFrame(rodarVU);
                    analyser.getByteFrequencyData(dataArray);
                    let soma = 0;
                    for (let i = 0; i < dataArray.length; i++) { soma += dataArray[i]; }
                    let volume = soma / dataArray.length;
                    let numLeds = Math.min(20, Math.round((volume / 120) * 20));

                    leds.forEach((led, index) => {
                        led.className = 'led';
                        if (index < numLeds && volume > 3) {
                            if (index <= 12) led.classList.add('green-on');
                            else if (index <= 16) led.classList.add('yellow-on');
                            else led.classList.add('red-on');
                        }
                    });
                }
                rodarVU();
            } catch (err) {
                statusLabel.innerText = "ERRO: PERMISSÃO NEGADA";
                statusLabel.style.backgroundColor = "#ff3333";
            }
        }
        window.onload = iniciarSistema;

        async function conectarCanalEstudio() {
            const numCanal = canalInput.value.trim();
            if(!numCanal) return alert("Digite um número de canal!");

            statusLabel.innerText = "CONECTANDO VIA RELAY STACK...";
            statusLabel.style.backgroundColor = "#f59e0b";

            // Nova arquitetura: Forçamos a criação de uma conexão ponto a ponto WebRTC em mesh fechada
            // Usando servidores de sinalização síncronos e abertos da comunidade em canais estritamente numéricos
            try {
                if (pc) pc.close();
                pc = new RTCPeerConnection({
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:global.stun.twilio.com:3478?transport=udp' }
                    ]
                });

                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                pc.ontrack = event => {
                    document.getElementById('remoteAudio').srcObject = event.streams[0];
                    statusLabel.innerText = "🔴 LINK ATIVO / NO AR";
                    statusLabel.style.backgroundColor = "#00ff66";
                    statusLabel.style.color = "#000";
                };

                // Criação do canal síncrono via link indireto de rede aberta
                const linkSignaling = `https://matrix-signaling-relayer.deno.dev/${numCanal}`;
                
                pc.onicecandidate = async event => {
                    if (!event.candidate && pc.localDescription) {
                        // Envia os dados de rede empacotados de uma só vez
                        await fetch(linkSignaling, {
                            method: 'POST',
                            body: JSON.stringify({ sdp: pc.localDescription })
                        }).catch(()=>{});
                    }
                };

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                // Polling ultrarrápido temporizado para interceptar a outra ponta sem usar WebSocket travado
                const checarConexao = setInterval(async () => {
                    const res = await fetch(linkSignaling).catch(()=>{});
                    if (res && res.ok) {
                        const dados = await res.json().catch(()=>{});
                        if (dados && dados.sdp && !pc.remoteDescription) {
                            clearInterval(checarConexao);
                            await pc.setRemoteDescription(new RTCSessionDescription(dados.sdp));
                            if (pc.remoteDescription.type === 'offer') {
                                const answer = await pc.createAnswer();
                                await pc.setLocalDescription(answer);
                                await fetch(linkSignaling, {
                                    method: 'POST',
                                    body: JSON.stringify({ sdp: pc.localDescription })
                                }).catch(()=>{});
                            }
                            statusLabel.innerText = "🔴 LINK ATIVO / NO AR";
                            statusLabel.style.backgroundColor = "#00ff66";
                            statusLabel.style.color = "#000";
                        }
                    }
                }, 1000);

            } catch(e) {
                statusLabel.innerText = "ERRO DE CONEXÃO";
                statusLabel.style.backgroundColor = "#ff3333";
            }
        }
    </script>
</body>
</html>
