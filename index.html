<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Codec IP - Link de Transmissão</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0c0e14; color: #e2e8f0; padding: 20px; }
        .codec-panel { max-width: 700px; margin: 30px auto; background-color: #161a26; border-radius: 12px; border: 1px solid #00f2fe; box-shadow: 0 0 25px rgba(0, 242, 254, 0.15); padding: 30px; }
        h1 { font-size: 22px; text-align: center; color: #fff; margin-bottom: 5px; letter-spacing: 1.5px; text-transform: uppercase; }
        .status-badge { display: inline-block; background-color: #3b82f6; color: #fff; padding: 4px 14px; border-radius: 20px; font-size: 11px; font-weight: bold; margin: 10px auto 25px auto; display: table; letter-spacing: 1px; }
        .config-section { background-color: #0d1017; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #22293a; }
        .config-section h3 { font-size: 13px; color: #00f2fe; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 0.5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
        select, input[type="text"], input[type="range"] { width: 100%; background-color: #161a26; border: 1px solid #22293a; color: #fff; padding: 10px; border-radius: 6px; font-size: 14px; outline: none; }
        input[type="text"]:focus, select:focus { border-color: #00f2fe; }
        .vu-modulation-wrapper { background-color: #0d1017; padding: 15px; border-radius: 8px; border: 1px solid #22293a; margin-bottom: 25px; }
        .vu-led-container { display: flex; justify-content: space-between; gap: 3px; height: 25px; background-color: #05070a; padding: 4px; border-radius: 4px; border: 1px solid #111; }
        .led { flex: 1; height: 100%; background-color: #1e293b; border-radius: 2px; transition: background-color 0.05s ease; }
        .led.green-on { background-color: #00ff66; box-shadow: 0 0 8px #00ff66; }
        .led.yellow-on { background-color: #ffcc00; box-shadow: 0 0 8px #ffcc00; }
        .led.red-on { background-color: #ff3333; box-shadow: 0 0 8px #ff3333; }
        .db-labels { display: flex; justify-content: space-between; font-size: 10px; font-family: monospace; color: #64748b; margin-top: 5px; padding: 0 4px; }
        .connection-box { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .btn-action { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 5px; }
        .btn-start { background-color: #00ff66; color: #000; }
        .btn-connect-peer { background-color: #3b82f6; color: #fff; }
        .btn-disconnect { background-color: #ff3333; color: white; }
    </style>
</head>
<body>

    <div class="codec-panel">
        <h1>MEU CODEC IP MULTILINK</h1>
        <div class="status-badge" id="statusLabel">CONECTANDO AO SERVIDOR DE REDE...</div>

        <div class="vu-modulation-wrapper">
            <label style="font-weight: bold; color: #fff; margin-bottom: 8px; display: block;">SUA MODULAÇÃO LOCAL:</label>
            <div class="vu-led-container">
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
            </div>
            <div class="db-labels">
                <span>-40 dB</span><span>-20 dB</span><span>-10 dB</span><span>-3 dB</span><span style="color: #ff3333;">0 dB (CLIP)</span>
            </div>
        </div>

        <div class="config-section">
            <h3>1. Chaves de Link (Estilo wGravBr)</h3>
            <div class="form-group">
                <label>Sua Identificação (Passe este ID para o outro participante):</label>
                <input type="text" id="myIdDisplay" readonly placeholder="Gerando ID...">
            </div>
            <hr style="border: 0; border-top: 1px solid #22293a; margin: 15px 0;">
            <div class="form-group connection-box">
                <label>Conectar ao ID do Participante Remoto:</label>
                <input type="text" id="remoteIdInput" placeholder="Cole aqui o ID gerado pelo outro PC/Celular">
                <button class="btn-action btn-connect-peer" onclick="conectarAoParticipante()">🔗 Linkar com Remoto</button>
            </div>
        </div>

        <div class="config-section">
            <h3>2. Canais de Áudio</h3>
            <div class="form-group">
                <label for="audioInput">Entrada (Microfone / Linha):</label>
                <select id="audioInput" onchange="reiniciarStream()"></select>
            </div>
        </div>

        <button class="btn-action btn-disconnect" onclick="desconectarTudo()">Cortar Transmissão / Reset</button>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <script>
        let localStream, peer, currentCall, audioContext, analyser, javascriptNode, sourceNode;
        const leds = document.querySelectorAll('.led');
        const statusLabel = document.getElementById('statusLabel');
        const myIdDisplay = document.getElementById('myIdDisplay');
        const remoteIdInput = document.getElementById('remoteIdInput');
        const audioInputSelect = document.getElementById('audioInput');
        const remoteAudio = document.getElementById('remoteAudio');

        // Inicializa o hardware de som
        async function inicializarAudio() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
                });
                
                // Popula a lista de microfones
                const devices = await navigator.mediaDevices.enumerateDevices();
                audioInputSelect.innerHTML = '';
                devices.forEach(device => {
                    if (device.kind === 'audioinput') {
                        const option = document.createElement('option');
                        option.value = device.deviceId;
                        option.text = device.label || `Microfone ${audioInputSelect.length + 1}`;
                        audioInputSelect.appendChild(option);
                    }
                });

                ativarVUMeter();
                inicializarRedeP2P();
            } catch (err) {
                statusLabel.innerText = "LIBERE O MICROFONE";
                statusLabel.style.backgroundColor = "#ff3333";
            }
        }

        // Lógica do VU Meter Local
        function ativarVUMeter() {
            if (audioContext) audioContext.close();
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            sourceNode = audioContext.createMediaStreamSource(localStream);
            javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);
            
            analyser.smoothingTimeConstant = 0.3;
            analyser.fftSize = 512;

            sourceNode.connect(analyser);
            analyser.connect(javascriptNode);
            javascriptNode.connect(audioContext.destination);

            javascriptNode.onaudioprocess = () => {
                const array = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(array);
                let maxVolume = 0;
                for (let i = 0; i < array.length; i++) { if (array[i] > maxVolume) maxVolume = array[i]; }
                const numLedsAcesos = Math.round((maxVolume / 255) * 20);

                leds.forEach((led, index) => {
                    const ledLevel = index + 1;
                    led.className = 'led';
                    if (ledLevel <= numLedsAcesos) {
                        if (ledLevel <= 13) led.classList.add('green-on');
                        else if (ledLevel <= 17) led.classList.add('yellow-on');
                        else led.classList.add('red-on');
                    }
                });
            };
        }

        // Inicializa a rede de transmissão ponto a ponto gratuita (PeerJS)
        function inicializarRedeP2P() {
            peer = new Peer({ debug: 1 });

            // Recebe o ID de rede gerado automaticamente
            peer.on('open', (id) => {
                myIdDisplay.value = id;
                statusLabel.innerText = "PRONTO / AGUARDANDO LINK";
                statusLabel.style.backgroundColor = "#3b82f6";
            });

            // Lógica para receber chamada (Estúdio recebendo áudio do repórter de rua)
            peer.on('call', (call) => {
                currentCall = call;
                statusLabel.innerText = "LINK ESTABELECIDO / NO AR";
                statusLabel.style.backgroundColor = "#00ff66";
                statusLabel.style.color = "#000";

                // Atende enviando o próprio microfone profissional de volta
                call.answer(localStream);

                // Recebe o áudio da outra pessoa e toca no fone/caixa
                call.on('stream', (remoteStream) => {
                    remoteAudio.srcObject = remoteStream;
                });
            });

            peer.on('error', (err) => {
                alert("Erro de Link na Rede: " + err.type);
            });
        }

        // Lógica para iniciar a chamada (Repórter discando para o ID do estúdio)
        function conectarAoParticipante() {
            const remoteId = remoteIdInput.value.trim();
            if (!remoteId) return alert("Por favor, cole o ID do participante remoto!");

            statusLabel.innerText = "CONECTANDO LINK IP...";
            statusLabel.style.backgroundColor = "#f59e0b";

            // Liga para o outro participante enviando nosso áudio
            currentCall = peer.call(remoteId, localStream);

            // Quando ele atender, pega o áudio dele de volta
            currentCall.on('stream', (remoteStream) => {
                remoteAudio.srcObject = remoteStream;
                statusLabel.innerText = "LINK TRANSMITINDO / NO AR";
                statusLabel.style.backgroundColor = "#00ff66";
                statusLabel.style.color = "#000";
            });
        }

        async function reiniciarStream() {
            const inputId = audioInputSelect.value;
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: { deviceId: inputId ? { exact: inputId } : undefined, echoCancellation: false, noiseSuppression: false, autoGainControl: false }
            });
            ativarVUMeter();
            if (currentCall && currentCall.peerConnection) {
                const sender = currentCall.peerConnection.getSenders().find(s => s.track.kind === 'audio');
                if (sender) sender.replaceTrack(localStream.getAudioTracks()[0]);
            }
        }

        function desconectarTudo() {
            if (currentCall) currentCall.close();
            remoteAudio.srcObject = null;
            statusLabel.innerText = "PRONTO / AGUARDANDO LINK";
            statusLabel.style.backgroundColor = "#3b82f6";
            statusLabel.style.color = "#fff";
            remoteIdInput.value = "";
        }

        window.onload = inicializarAudio;
    </script>
</body>
</html>
