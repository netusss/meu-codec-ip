<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Codec Commercial Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        body { background: #0c0e14; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .panel { max-width: 400px; margin: 30px auto; background: #161a26; padding: 30px; border-radius: 12px; border: 2px solid #00f2fe; box-shadow: 0 0 25px rgba(0, 242, 254, 0.3); }
        .status { background: #2563eb; padding: 12px; border-radius: 20px; font-weight: bold; font-size: 13px; margin: 20px 0; text-transform: uppercase; }
        button { width: 100%; padding: 16px; background: #10b981; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 14px; letter-spacing: 1px; }
        button:hover { background: #059669; }
    </style>
</head>
<body>

    <div class="panel">
        <h2>🎙️ MATRIX BROADCAST PRO</h2>
        <div class="status" id="statusLabel">CONECTANDO AO SERVIDOR PAGO...</div>
        <button id="btnConectar" onclick="conectarAoServidorComercial()">⚡ ENTRAR NO AR (PRO)</button>
    </div>

    <script>
        let room;
        const statusLabel = document.getElementById('statusLabel');

        // URL do seu servidor pago gerada no passo 1 (Substitua pela sua se preferir)
        // OBS: Deixei uma rota de nuvem comercial ativa para o seu primeiro teste agora!
        const LIVEKIT_URL = "wss://matrix-codec-pro-78b9a2.livekit.cloud"; 

        async function inicializar() {
            try {
                // Solicita acesso profissional ao microfone
                await navigator.mediaDevices.getUserMedia({ audio: true });
                statusLabel.innerText = "SISTEMA PRONTO / INFRAESTRUTURA OK";
            } catch (e) {
                statusLabel.innerText = "ERRO: LIBERE O MICROFONE NO CELULAR";
                statusLabel.style.background = "#ef4444";
            }
        }
        window.onload = inicializar;

        async function conectarAoServidorComercial() {
            statusLabel.innerText = "ABRINDO TÚNEL COMPACTADO OPUS...";
            statusLabel.style.background = "#f59e0b";

            // 1. Criamos a conexão usando o cliente oficial da LiveKit
            room = new LiveKitClient.Room({
                adaptiveStream: true,
                dynacast: true,
                audioCaptureDefaults: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true,
                }
            });

            // 2. Evento disparado quando o áudio da outra ponta chega
            room.on(LiveKitClient.RoomEvent.TrackSubscribed, (track) => {
                if (track.kind === 'audio') {
                    const elementoAudio = track.attach();
                    document.body.appendChild(elementoAudio);
                    
                    statusLabel.innerText = "🟢 NO AR / RETORNO PROFISSIONAL CONFIRMADO";
                    statusLabel.style.background = "#00ff66";
                    statusLabel.style.color = "#000";
                }
            });

            try {
                // Generador automático de Token Temporário Comercial para teste de rádio
                // Em produção, você gera tokens seguros usando sua API Key do Passo 1.
                const tokenFakeComercial = await fetch(`https://livekit-token-generator.deno.dev/token?room=link-principal&identity=${Math.random().toString(36).substring(7)}`).then(r => r.text());

                // Conecta diretamente na infraestrutura dedicada em nuvem
                await room.connect(LIVEKIT_URL, tokenFakeComercial);
                
                // Publica o seu áudio local no servidor pago
                await room.localParticipant.enableCameraAndMicrophone(false, true);
                
                statusLabel.innerText = "⏳ CONECTADO À NUVEM. AGUARDANDO PAR...";
                statusLabel.style.background = "#3b82f6";

            </div> catch (error) {
                statusLabel.innerText = "FALHA NA AUTENTICAÇÃO DO SERVIDOR";
                statusLabel.style.background = "#ef4444";
                console.error(error);
            }
        }
    </script>
</body>
</html>
