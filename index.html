<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codec IP Matrix - Alta Estabilidade</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0c0e14; color: #e2e8f0; padding: 20px; }
        .codec-panel { max-width: 700px; margin: 30px auto; background-color: #161a26; border-radius: 12px; border: 1px solid #00f2fe; box-shadow: 0 0 25px rgba(0, 242, 254, 0.15); padding: 30px; }
        h1 { font-size: 22px; text-align: center; color: #fff; margin-bottom: 5px; letter-spacing: 1.5px; text-transform: uppercase; }
        .status-badge { display: inline-block; background-color: #3b82f6; color: #fff; padding: 4px 14px; border-radius: 20px; font-size: 11px; font-weight: bold; margin: 10px auto 25px auto; display: table; letter-spacing: 1px; }
        .config-section { background-color: #0d1017; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #22293a; }
        .config-section h3 { font-size: 13px; color: #00f2fe; text-transform: uppercase; margin-bottom: 15px; letter-spacing: 0.5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
        select, input[type="text"], textarea { width: 100%; background-color: #161a26; border: 1px solid #22293a; color: #fff; padding: 10px; border-radius: 6px; font-size: 14px; outline: none; }
        textarea { font-family: monospace; height: 80px; resize: none; font-size: 11px; color: #00f2fe; }
        .vu-modulation-wrapper { background-color: #0d1017; padding: 15px; border-radius: 8px; border: 1px solid #22293a; margin-bottom: 25px; }
        .vu-led-container { display: flex; justify-content: space-between; gap: 3px; height: 25px; background-color: #05070a; padding: 4px; border-radius: 4px; border: 1px solid #111; }
        .led { flex: 1; height: 100%; background-color: #1e293b; border-radius: 2px; transition: background-color 0.02s ease; }
        .led.green-on { background-color: #00ff66; box-shadow: 0 0 8px #00ff66; }
        .led.yellow-on { background-color: #ffcc00; box-shadow: 0 0 8px #ffcc00; }
        .led.red-on { background-color: #ff3333; box-shadow: 0 0 8px #ff3333; }
        .db-labels { display: flex; justify-content: space-between; font-size: 10px; font-family: monospace; color: #64748b; margin-top: 5px; padding: 0 4px; }
        .btn-action { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 5px; }
        .btn-connect-peer { background-color: #00ff66; color: #000; }
        .btn-disconnect { background-color: #ff3333; color: white; }
    </style>
</head>
<body>

    <div class="codec-panel">
        <h1>MEU CODEC IP MATRIX</h1>
        <div class="status-badge" id="statusLabel">CONFIGURANDO AUDIO...</div>

        <div class="vu-modulation-wrapper">
            <label style="font-weight: bold; color: #fff; margin-bottom: 8px; display: block;">SUA MODULAÇÃO LOCAL:</label>
            <div class="vu-led-container">
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
            </div>
            <div class="db-labels">
                <span>-40 dB</span><span>-20 dB</span><span>-10 dB</span><span>-3 dB</span><span style="color: #ff3333;">0 dB (CLIP)</span>
            </div>
        </div>

        <div class="config-section">
            <h3>1. Chave de Pareamento Sem Servidor (Fura Qualquer Bloqueio)</h3>
            <div class="form-group">
                <label>Sua Chave Local (Copie e envie para o outro aparelho):</label>
                <textarea id="localCode" readonly placeholder="Gerando chave..."></textarea>
            </div>
            <div class="form-group">
                <label>Colar Chave do Aparelho Remoto:</label>
                <textarea id="remoteCode" placeholder="Cole aqui a chave gerada pelo outro PC ou Celular"></textarea>
            </div>
            <button class="btn-action btn-connect-peer" onclick="conectarChave()">⚡ Validar e Conectar Link</button>
        </div>

        <div class="config-section">
            <h3>2. Hardware de Áudio</h3>
            <div class="form-group">
                <label for="audioInput">Dispositivo de Entrada (Microfone):</label>
                <select id="audioInput" onchange="trocarMicrofone()"></select>
            </div>
        </div>

        <button class="btn-action btn-disconnect" onclick="location.reload()">Cortar / Resetar</button>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <script>
        let localStream, p, audioContext, analyser, javascriptNode, sourceNode;
        const leds = document.querySelectorAll('.led');
        const statusLabel = document.getElementById('statusLabel');
        const audioInputSelect = document.getElementById('audioInput');
        const remoteAudio = document.getElementById('remoteAudio');
        const localCodeArea = document.getElementById('localCode');
        const remoteCodeArea = document.getElementById('remoteCode');

        async function iniciarSistema() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
                });

                const devices = await navigator.mediaDevices.enumerateDevices();
                audioInputSelect.innerHTML = '';
                devices.forEach(device => {
                    if (device.kind === 'audioinput') {
                        const option = document.createElement('option');
                        option.value = device.deviceId;
                        option.text = device.label || `Microfone ${audioInputSelect.length + 1}`;
                        audioInputSelect.appendChild(option);
                    }
                });

                statusLabel.innerText = "PRONTO PARA CRIAR LINK";
                statusLabel.style.backgroundColor = "#3b82f6";
                ativarVUMeter();
                criarInstanciaPeer(true); // Inicializa como criador do link por padrão
            } catch (err) {
                statusLabel.innerText = "ERRO DE AUDIO";
                statusLabel.style.backgroundColor = "#ff3333";
            }
        }

        function criarInstanciaPeer(isInitiator) {
            if (p) p.destroy();

            p = new SimplePeer({
                initiator: isInitiator,
                trickle: false,
                stream: localStream,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });

            p.on('signal', data => {
                localCodeArea.value = btoa(JSON.stringify(data));
            });

            p.on('stream', stream => {
                remoteAudio.srcObject = stream;
                statusLabel.innerText = "NO AR / LINK ATIVO";
                statusLabel.style.backgroundColor = "#00ff66";
                statusLabel.style.color = "#000";
            });

            p.on('error', err => {
                console.error('Erro de conexão:', err);
                statusLabel.innerText = "LINK DESCONECTADO";
                statusLabel.style.backgroundColor = "#ff3333";
                statusLabel.style.color = "#fff";
            });

            p.on('close', () => {
                statusLabel.innerText = "LINK ENCERRADO";
                statusLabel.style.backgroundColor = "#22293a";
            });
        }

        function conectarChave() {
            const rawCode = remoteCodeArea.value.trim();
            if (!rawCode) return alert("Por favor, cole a chave do outro aparelho!");

            try {
                const parsedData = JSON.parse(atob(rawCode));
                
                // Se o código colado for uma oferta e nós também iniciamos, mudamos para modo receptor
                if (parsedData.type === 'offer' && p.initiator) {
                    criarInstanciaPeer(false);
                    p.signal(parsedData);
                } else {
                    p.signal(parsedData);
                }
                
                statusLabel.innerText = "ESTABELECENDO LINK...";
                statusLabel.style.backgroundColor = "#f59e0b";
            } catch (e) {
                alert("Chave inválida ou corrompida! Verifique se copiou o texto completo.");
            }
        }

        function ativarVUMeter() {
            if (audioContext) audioContext.close();
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            sourceNode = audioContext.createMediaStreamSource(localStream);
            javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);
            
            analyser.smoothingTimeConstant = 0.15;
            analyser.fftSize = 512;

            sourceNode.connect(analyser);
            analyser.connect(javascriptNode);
            javascriptNode.connect(audioContext.destination);

            javascriptNode.onaudioprocess = () => {
                const array = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(array);
                let maxVolume = 0;
                for (let i = 0; i < array.length; i++) { if (array[i] > maxVolume) maxVolume = array[i]; }
                
                const numLedsAcesos = Math.min(20, Math.round(((maxVolume * 1.3) / 255) * 20));

                leds.forEach((led, index) => {
                    const ledLevel = index + 1;
                    led.className = 'led';
                    if (ledLevel <= numLedsAcesos && maxVolume > 10) {
                        if (ledLevel <= 13) led.classList.add('green-on');
                        else if (ledLevel <= 17) led.classList.add('yellow-on');
                        else led.classList.add('red-on');
                    }
                });
            };
        }

        async function trocarMicrofone() {
            const inputId = audioInputSelect.value;
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: { deviceId: inputId ? { exact: inputId } : undefined, echoCancellation: false, noiseSuppression: false, autoGainControl: false }
            });
            ativarVUMeter();
            if (p) {
                const sender = p._pc.getSenders().find(s => s.track.kind === 'audio');
                if (sender) sender.replaceTrack(localStream.getAudioTracks()[0]);
            }
        }

        window.onload = iniciarSistema;
    </script>
</body>
</html>
