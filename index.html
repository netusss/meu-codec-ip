<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codec IP Matrix - Ultra Estável</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0c0e14; color: #e2e8f0; padding: 20px; }
        .codec-panel { max-width: 600px; margin: 50px auto; background-color: #161a26; border-radius: 12px; border: 2px solid #00f2fe; box-shadow: 0 0 25px rgba(0, 242, 254, 0.2); padding: 30px; text-align: center; }
        h1 { font-size: 24px; color: #fff; margin-bottom: 20px; letter-spacing: 1.5px; }
        .status-badge { display: inline-block; background-color: #f59e0b; color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 14px; font-weight: bold; margin-bottom: 25px; width: 100%; text-transform: uppercase; }
        .btn-action { width: 100%; padding: 16px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 15px; transition: 0.2s; }
        .btn-blue { background-color: #3b82f6; color: #fff; }
        .btn-green { background-color: #00ff66; color: #000; display: none; } /* Só aparece após liberar mic */
        .btn-reset { background-color: #22293a; color: #94a3b8; font-size: 12px; padding: 8px; margin-top: 20px; }
        .room-box { background-color: #0d1017; padding: 15px; border-radius: 8px; border: 1px solid #22293a; margin-bottom: 20px; }
        input { width: 100%; background-color: #161a26; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 6px; text-align: center; font-size: 16px; font-weight: bold; margin-top: 5px; outline: none; }
    </style>
    <script src="https://cdn.scaledrone.com/scaledrone.min.js"></script>
</head>
<body>

    <div class="codec-panel">
        <h1>CODEC IP MATRIX</h1>
        
        <div class="status-badge" id="statusLabel">1º PASSO: ATIVAR ÁUDIO</div>

        <button class="btn-action btn-blue" id="btnAtivar" onclick="ligarMicrofone()">🎤 CLIQUE PARA LIGAR MICROFONE</button>

        <div class="room-box">
            <label style="font-size: 12px; color: #94a3b8;">NOME DA SALA (IGUAL NOS DOIS LADOS):</label>
            <input type="text" id="roomInput" value="sala-conexao-direta">
        </div>

        <button class="btn-action btn-green" id="btnConectar" onclick="conectarCanal()">⚡ CONECTAR TRANSMISSÃO</button>

        <button class="btn-action btn-reset" onclick="location.reload()">Resetar Sistema</button>
    </div>

    <audio id="remoteAudio" autoplay playsinline></audio>

    <script>
        const SCALEDRONE_CHANNEL_ID = 'cZNB0j3LazMXWekH'; // Seu ID configurado

        let localStream, pc, drone, room;

        const iceConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478?transport=udp' }
            ]
        };

        // Ativa o microfone de forma limpa e sem scripts visuais pesados
        async function ligarMicrofone() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
                });

                document.getElementById('statusLabel').innerText = "MICROFONE PRONTO / LIBERADO";
                document.getElementById('statusLabel').style.backgroundColor = "#3b82f6";
                
                // Esconde o botão azul e mostra o verde de conectar
                document.getElementById('btnAtivar').style.display = "none";
                document.getElementById('btnConectar').style.display = "block";
            } catch (err) {
                document.getElementById('statusLabel').innerText = "ERRO: PERMISSÃO NEGADA";
                document.getElementById('statusLabel').style.backgroundColor = "#ff3333";
                alert("Clique no cadeado ao lado do link do site e mude o Microfone para PERMITIR.");
            }
        }

        function conectarCanal() {
            const sala = document.getElementById('roomInput').value.trim();
            document.getElementById('statusLabel').innerText = "CONECTANDO LINK INTERNET...";
            document.getElementById('statusLabel').style.backgroundColor = "#f59e0b";

            drone = new ScaleDrone(SCALEDRONE_CHANNEL_ID);
            
            drone.on('open', error => {
                if (error) return console.error(error);
                
                room = drone.subscribe(`observable-${sala}`);
                
                room.on('open', error => {
                    if (error) return console.error(error);
                    document.getElementById('statusLabel').innerText = "AGUARDANDO O OUTRO APARELHO...";
                    document.getElementById('statusLabel').style.backgroundColor = "#10b981";
                });

                room.on('members', members => {
                    if (members.length > 1) {
                        inicializarWebRTC(true);
                    } else {
                        inicializarWebRTC(false);
                    }
                });

                room.on('member_join', () => {
                    inicializarWebRTC(true);
                });

                room.on('data', (message, client) => {
                    if (client.id === drone.clientId) return;

                    if (message.sdp) {
                        pc.setRemoteDescription(new RTCSessionDescription(message.sdp), () => {
                            if (pc.remoteDescription.type === 'offer') {
                                pc.createAnswer().then(description => {
                                    pc.setLocalDescription(description, () => {
                                        enviarSinal({ sdp: pc.localDescription });
                                    }, console.error);
                                });
                            }
                        }, console.error);
                    } else if (message.candidate) {
                        pc.addIceCandidate(new RTCIceCandidate(message.candidate), () => {}, console.error);
                    }
                });
            });
        }

        function inicializarWebRTC(deveCriarOferta) {
            if (pc) pc.close();
            pc = new RTCPeerConnection(iceConfig);

            pc.onicecandidate = event => {
                if (event.candidate) enviarSinal({ candidate: event.candidate });
            };

            pc.ontrack = event => {
                document.getElementById('remoteAudio').srcObject = event.streams[0];
                document.getElementById('statusLabel').innerText = "🔴 NO AR / CONECTADO!";
                document.getElementById('statusLabel').style.backgroundColor = "#00ff66";
                document.getElementById('statusLabel').style.color = "#000";
            };

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            if (deveCriarOferta) {
                pc.createOffer().then(description => {
                    pc.setLocalDescription(description, () => {
                        enviarSinal({ sdp: pc.localDescription });
                    }, console.error);
                });
            }
        }

        function enviarSinal(message) {
            const sala = document.getElementById('roomInput').value.trim();
            if (drone && room) {
                drone.publish({ room: `observable-${sala}`, message });
            }
        }
    </script>
</body>
</html>
