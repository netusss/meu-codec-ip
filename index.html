<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX LIVE CODEC PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0c0e14; color: #e2e8f0; padding: 15px; }
        .codec-panel { max-width: 500px; margin: 40px auto; background-color: #161a26; border-radius: 12px; border: 2px solid #00f2fe; box-shadow: 0 0 25px rgba(0, 242, 254, 0.2); padding: 25px; transition: all 0.4s ease; }
        .success-glow { border-color: #00ff66 !important; box-shadow: 0 0 35px rgba(0, 255, 102, 0.5) !important; }
        h1 { font-size: 20px; text-align: center; color: #fff; margin-bottom: 5px; letter-spacing: 1px; text-transform: uppercase; }
        .status-badge { display: inline-block; background-color: #3b82f6; color: #fff; padding: 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 20px; text-align: center; width: 100%; text-transform: uppercase; }
        
        /* VU METER */
        .vu-modulation-wrapper { background-color: #0d1017; padding: 15px; border-radius: 8px; border: 1px solid #22293a; margin-bottom: 20px; }
        .vu-led-container { display: flex; justify-content: space-between; gap: 3px; height: 24px; background-color: #05070a; padding: 4px; border-radius: 4px; }
        .led { flex: 1; height: 100%; background-color: #1e293b; border-radius: 1px; }
        .led.green-on { background-color: #00ff66; box-shadow: 0 0 8px #00ff66; }
        .led.yellow-on { background-color: #ffcc00; box-shadow: 0 0 8px #ffcc00; }
        .led.red-on { background-color: #ff3333; box-shadow: 0 0 8px #ff3333; }

        .btn-action { width: 100%; padding: 16px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; background-color: #10b981; color: #fff; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        .btn-action:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div class="codec-panel" id="panelMatrix">
        <h1>🎙️ MATRIX LIVE CODEC PRO</h1>
        <div class="status-badge" id="statusLabel">INICIALIZANDO ÁUDIO...</div>

        <div class="vu-modulation-wrapper">
            <div class="vu-led-container">
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
            </div>
        </div>

        <button class="btn-action" onclick="conectarCanalPrivado()">⚡ ENTRAR NO AR NOW</button>
    </div>

    <script>
        let localStream, room, audioContext, analyser;
        const leds = document.querySelectorAll('.led');
        const statusLabel = document.getElementById('statusLabel');
        const panelMatrix = document.getElementById('panelMatrix');

        // CREDENCIAIS DA SUA EMISSORA TOTALMENTE EMBUTIDAS
        const LIVEKIT_URL = "wss://transmissao-codec-dsw7b7ed.livekit.cloud";
        const API_KEY     = "APItrtz8cL4iH6i";
        const API_SECRET  = "yvJKlc8C8Xu5snncr5Po4yOTyqkaA8NCyUKy1zsnexa";

        async function inicializarAudio() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });

                statusLabel.innerText = "PRONTO PARA CONECTAR";
                statusLabel.style.backgroundColor = "#3b82f6";

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(localStream);
                analyser.fftSize = 64;
                source.connect(analyser);
                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function rodarVU() {
                    if (!localStream) return;
                    requestAnimationFrame(rodarVU);
                    analyser.getByteFrequencyData(dataArray);
                    let soma = 0;
                    for (let i = 0; i < dataArray.length; i++) { soma += dataArray[i]; }
                    let volume = soma / dataArray.length;
                    let numLeds = Math.min(20, Math.round((volume / 120) * 20));

                    leds.forEach((led, index) => {
                        led.className = 'led';
                        if (index < numLeds && volume > 3) {
                            if (index <= 12) led.classList.add('green-on');
                            else if (index <= 16) led.classList.add('yellow-on');
                            else led.classList.add('red-on');
                        }
                    });
                }
                rodarVU();
            } catch (err) {
                statusLabel.innerText = "ERRO: PERMISSÃO DO MICROFONE";
                statusLabel.style.backgroundColor = "#ff3333";
            }
        }
        window.onload = inicializarAudio;

        async function conectarCanalPrivado() {
            statusLabel.innerText = "CONECTANDO NA INFRAESTRUTURA PAGA...";
            statusLabel.style.backgroundColor = "#f59e0b";

            room = new LiveKitClient.Room({
                adaptiveStream: true,
                dynacast: true,
                audioCaptureDefaults: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
            });

            // GATILHO DE RETORNO DO ÁUDIO DA OUTRA PONTA
            room.on(LiveKitClient.RoomEvent.TrackSubscribed, (track) => {
                if (track.kind === 'audio') {
                    const element = track.attach();
                    document.body.appendChild(element);
                    
                    statusLabel.innerText = "🟢 CONECTADO / RETORNO 100% OK";
                    statusLabel.style.backgroundColor = "#00ff66";
                    statusLabel.style.color = "#000";
                    panelMatrix.classList.add("success-glow");
                }
            });

            try {
                // Solicita o token direto utilizando sua API Key dedicada
                const token = await fetch(`https://livekit-token-generator.deno.dev/token?room=link-estudio-rua&identity=user_${Math.random().toString(36).substring(5)}&apiKey=${API_KEY}&apiSecret=${API_SECRET}`)
                    .then(r => {
                        if (!r.ok) throw new Error();
                        return r.text();
                    });

                // Conecta os servidores dedicados da sua conta LiveKit
                await room.connect(LIVEKIT_URL, token);
                
                // Abre a transmissão de áudio para o servidor
                await room.localParticipant.enableCameraAndMicrophone(false, true);
                
                statusLabel.innerText = "⏳ LINK SEGURO ATIVO. AGUARDANDO PAR...";
                statusLabel.style.backgroundColor = "#2563eb";

            } catch (error) {
                statusLabel.innerText = "FALHA NA CONEXÃO COM O SERVIDOR";
                statusLabel.style.backgroundColor = "#ff3333";
            }
        }
    </script>
</body>
</html>
