<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codec IP Matrix - Reportagem UP</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0c0e14; color: #e2e8f0; padding: 15px; }
        .codec-panel { max-width: 500px; margin: 15px auto; background-color: #161a26; border-radius: 12px; border: 2px solid #00f2fe; box-shadow: 0 0 25px rgba(0, 242, 254, 0.2); padding: 20px; }
        h1 { font-size: 20px; text-align: center; color: #fff; margin-bottom: 5px; letter-spacing: 1px; text-transform: uppercase; }
        .status-badge { display: inline-block; background-color: #3b82f6; color: #fff; padding: 10px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 15px; text-align: center; width: 100%; text-transform: uppercase; letter-spacing: 0.5px; }
        .vu-modulation-wrapper { background-color: #0d1017; padding: 12px; border-radius: 8px; border: 1px solid #22293a; margin-bottom: 15px; }
        .vu-led-container { display: flex; justify-content: space-between; gap: 2px; height: 22px; background-color: #05070a; padding: 3px; border-radius: 4px; }
        .led { flex: 1; height: 100%; background-color: #1e293b; border-radius: 1px; }
        .led.green-on { background-color: #00ff66; box-shadow: 0 0 6px #00ff66; }
        .led.yellow-on { background-color: #ffcc00; box-shadow: 0 0 6px #ffcc00; }
        .led.red-on { background-color: #ff3333; box-shadow: 0 0 6px #ff3333; }
        .config-section { background-color: #0d1017; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #22293a; text-align: center; }
        input { width: 100%; background-color: #161a26; border: 1px solid #334155; color: #fff; padding: 12px; border-radius: 6px; font-size: 16px; outline: none; margin-top: 5px; text-align: center; font-weight: bold; letter-spacing: 1px; }
        .btn-action { width: 100%; padding: 15px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 10px; transition: 0.2s; }
        .btn-blue { background-color: #3b82f6; color: #fff; }
        .btn-green { background-color: #00ff66; color: #000; display: none; }
    </style>
    <script src="https://unpkg.com/piesocket-js@2"></script>
</head>
<body>

    <div class="codec-panel">
        <h1>🎙️ MATRIX LIVE CODEC</h1>
        <div class="status-badge" id="statusLabel">1º PASSO: ATIVAR AUDIO</div>

        <button class="btn-action btn-blue" id="btnAtivar" onclick="forcarMicrofoneEVU()">🎤 LIBERAR MICROFONE LOCAL</button>

        <div class="vu-modulation-wrapper">
            <div class="vu-led-container">
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
            </div>
        </div>

        <div class="config-section">
            <label style="font-size: 11px; color: #94a3b8; text-transform: uppercase;">Nome do Canal (Combine com o Estúdio):</label>
            <input type="text" id="roomInput" value="link-reportagem">
        </div>

        <button class="btn-action btn-green" id="btnConectar" onclick="conectarAoEstudio()">⚡ ENTRAR NO AR</button>
    </div>

    <audio id="remoteAudio" autoplay playsinline></audio>

    <script>
        let localStream, pc, pieSocket, channel, audioContext, analyser;
        const leds = document.querySelectorAll('.led');
        const statusLabel = document.getElementById('statusLabel');
        const btnAtivar = document.getElementById('btnAtivar');
        const btnConectar = document.getElementById('btnConectar');
        const roomInput = document.getElementById('roomInput');

        const iceConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478?transport=udp' }
            ]
        };

        async function forcarMicrofoneEVU() {
            try {
                // Configurações focadas em broadcasting de voz limpa e sem travas de ganho do celular
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                });

                statusLabel.innerText = "MICROFONE PRONTO";
                statusLabel.style.backgroundColor = "#3b82f6";
                btnAtivar.style.display = "none";
                btnConectar.style.display = "block"; // Libera o botão de entrar no ar imediatamente

                // Ativação do VU pós-clique físico para burlar travas do Chrome Mobile
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(localStream);
                analyser.fftSize = 64;
                source.connect(analyser);
                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function rodarVU() {
                    if (!localStream) return;
                    requestAnimationFrame(rodarVU);
                    analyser.getByteFrequencyData(dataArray);
                    let soma = 0;
                    for (let i = 0; i < dataArray.length; i++) { soma += dataArray[i]; }
                    let volume = soma / dataArray.length;
                    let numLeds = Math.min(20, Math.round((volume / 120) * 20));

                    leds.forEach((led, index) => {
                        led.className = 'led';
                        if (index < numLeds && volume > 3) {
                            if (index <= 12) led.classList.add('green-on');
                            else if (index <= 16) led.classList.add('yellow-on');
                            else led.classList.add('red-on');
                        }
                    });
                }
                rodarVU();

            } catch (err) {
                statusLabel.innerText = "ERRO: PERMISSÃO NEGADA";
                statusLabel.style.backgroundColor = "#ff3333";
                alert("Por favor, clique no ícone de cadeado do navegador e mude o Microfone para PERMITIR!");
            }
        }

        function conectarAoEstudio() {
            const sala = roomInput.value.trim();
            statusLabel.innerText = "SINTONIZANDO CANAL...";
            statusLabel.style.backgroundColor = "#f59e0b";

            // Inicializa a sinalização automática do PieSocket (Chave pública de teste estável)
            pieSocket = new PieSocket({
                clusterId: "demo",
                apiKey: "oCdC2zZGjpxGVm3WM716GvN2SMrw7asA7qfSsmYI" 
            });

            channel = pieSocket.subscribe(sala);

            channel.on("open", () => {
                statusLabel.innerText = "LINK CONECTADO / ENTRANDO NO AR...";
                statusLabel.style.backgroundColor = "#10b981";
                configurarConexaoWebRTC(true);
            });

            channel.on("message", async (msg) => {
                const message = JSON.parse(msg.data);
                
                if (message.sdp) {
                    await pc.setRemoteDescription(new RTCSessionDescription(message.sdp));
                    if (pc.remoteDescription.type === 'offer') {
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        channel.send(JSON.stringify({ sdp: pc.localDescription }));
                    }
                } else if (message.candidate) {
                    try {
                        await pc.addIceCandidate(new RTCIceCandidate(message.candidate));
                    } catch (e) {}
                }
            });
        }

        function configurarConexaoWebRTC(criarOferta) {
            if (pc) pc.close();
            pc = new RTCPeerConnection(iceConfig);

            pc.onicecandidate = event => {
                if (event.candidate) channel.send(JSON.stringify({ candidate: event.candidate }));
            };

            pc.ontrack = event => {
                document.getElementById('remoteAudio').srcObject = event.streams[0];
                statusLabel.innerText = "🔴 NO AR (LINK DIRETO ATIVO)";
                statusLabel.style.backgroundColor = "#00ff66";
                statusLabel.style.color = "#000";
            };

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            if (criarOferta) {
                pc.onnegotiationneeded = async () => {
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    channel.send(JSON.stringify({ sdp: pc.localDescription }));
                };
            }
        }
    </script>
</body>
</html>
