<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codec IP Matrix - Broadcast</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0c0e14; color: #e2e8f0; padding: 15px; }
        .codec-panel { max-width: 500px; margin: 20px auto; background-color: #161a26; border-radius: 12px; border: 2px solid #00f2fe; box-shadow: 0 0 25px rgba(0, 242, 254, 0.2); padding: 25px; transition: all 0.4s ease; }
        .success-glow { border-color: #00ff66 !important; box-shadow: 0 0 35px rgba(0, 255, 102, 0.5) !important; }
        h1 { font-size: 20px; text-align: center; color: #fff; margin-bottom: 5px; letter-spacing: 1px; text-transform: uppercase; }
        .status-badge { display: inline-block; background-color: #3b82f6; color: #fff; padding: 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 20px; text-align: center; width: 100%; text-transform: uppercase; transition: 0.2s; }
        .vu-modulation-wrapper { background-color: #0d1017; padding: 15px; border-radius: 8px; border: 1px solid #22293a; margin-bottom: 20px; }
        .vu-led-container { display: flex; justify-content: space-between; gap: 3px; height: 24px; background-color: #05070a; padding: 4px; border-radius: 4px; }
        .led { flex: 1; height: 100%; background-color: #1e293b; border-radius: 1px; }
        .led.green-on { background-color: #00ff66; box-shadow: 0 0 8px #00ff66; }
        .led.yellow-on { background-color: #ffcc00; box-shadow: 0 0 8px #ffcc00; }
        .led.red-on { background-color: #ff3333; box-shadow: 0 0 8px #ff3333; }
        .config-section { background-color: #0d1017; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #22293a; text-align: center; }
        input { width: 100%; background-color: #161a26; border: 1px solid #334155; color: #00f2fe; padding: 12px; border-radius: 6px; font-size: 18px; outline: none; margin-top: 5px; text-align: center; font-weight: bold; letter-spacing: 1px; }
        .btn-action { width: 100%; padding: 16px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-green { background-color: #10b981; color: #fff; }
        .btn-unmute { background-color: #f59e0b; color: #000; margin-top: 10px; display: none; font-size: 14px; }
    </style>
</head>
<body>

    <div class="codec-panel" id="panelMatrix">
        <h1>🎙️ MATRIX LIVE CODEC v4</h1>
        <div class="status-badge" id="statusLabel">INICIALIZANDO MICROFONE...</div>

        <div class="vu-modulation-wrapper">
            <div class="vu-led-container">
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
                <div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div><div class="led"></div>
            </div>
        </div>

        <div class="config-section">
            <label style="font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: bold;">CÓDIGO DE SINCRONISMO DOS CODECS:</label>
            <input type="text" id="roomInput" value="matrix-prime">
        </div>

        <button class="btn-action btn-green" id="btnConectar" onclick="conectarTransmissao()">⚡ CONECTAR LINHA DIRETA</button>
        <button class="btn-action btn-unmute" id="btnUnmute" onclick="forcarAudioCelular()">🔊 CLIQUE AQUI PARA OUVIR O RETORNO</button>
    </div>

    <audio id="remoteAudio" autoplay playsinline></audio>

    <script>
        let localStream, pc, ws, audioContext, analyser;
        const leds = document.querySelectorAll('.led');
        const statusLabel = document.getElementById('statusLabel');
        const roomInput = document.getElementById('roomInput');
        const panelMatrix = document.getElementById('panelMatrix');
        const btnUnmute = document.getElementById('btnUnmute');
        const remoteAudio = document.getElementById('remoteAudio');

        // Servidores Google STUN e Twilio integrados para quebrar o CGNAT do 4G/5G
        const iceConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' }
            ]
        };

        // Alerta Sonoro de Conexão Ativa
        function darBipeSucesso() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sine";
                osc.frequency.value = 700;
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.25);
            } catch(e) {}
        }

        // Auto-start do Microfone e VU
        async function inicializarAudioLocal() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true }
                });

                statusLabel.innerText = "SISTEMA PRONTO / DIGITE O CANAL";
                statusLabel.style.backgroundColor = "#3b82f6";

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(localStream);
                analyser.fftSize = 64;
                source.connect(analyser);
                const dataArray = new Uint8Array(analyser.frequencyBinCount);

                function rodarVU() {
                    if (!localStream) return;
                    requestAnimationFrame(rodarVU);
                    analyser.getByteFrequencyData(dataArray);
                    let soma = 0;
                    for (let i = 0; i < dataArray.length; i++) { soma += dataArray[i]; }
                    let volume = soma / dataArray.length;
                    let numLeds = Math.min(20, Math.round((volume / 120) * 20));

                    leds.forEach((led, index) => {
                        led.className = 'led';
                        if (index < numLeds && volume > 3) {
                            if (index <= 12) led.classList.add('green-on');
                            else if (index <= 16) led.classList.add('yellow-on');
                            else led.classList.add('red-on');
                        }
                    });
                }
                rodarVU();
            } catch (err) {
                statusLabel.innerText = "ERRO: LIBERE O MICROFONE";
                statusLabel.style.backgroundColor = "#ff3333";
            }
        }
        window.onload = inicializarAudioLocal;

        function conectarTransmissao() {
            const sala = roomInput.value.trim();
            statusLabel.innerText = "📡 ESTABELECENDO PONTE DE REDE...";
            statusLabel.style.backgroundColor = "#f59e0b";

            // Nova rota global via PieSocket pública sem barreiras de região
            ws = new WebSocket(`wss://demo.piesocket.com/v3/${sala}?api_key=VCXCEuvK8oxJgGSWKAwZThOmR6W85H506iG7XwQC&notify_self=0`);

            ws.onopen = () => {
                statusLabel.innerText = "⏳ AGUARDANDO OUTRO APARELHO ENTRAR...";
                statusLabel.style.backgroundColor = "#2563eb";
                configurarWebRTC(true);
            };

            ws.onmessage = async (event) => {
                const message = JSON.parse(event.data);

                if (message.sdp) {
                    await pc.setRemoteDescription(new RTCSessionDescription(message.sdp));
                    if (pc.remoteDescription.type === 'offer') {
                        const answer = await pc.createAnswer();
                        await pc.setLocalDescription(answer);
                        ws.send(JSON.stringify({ sdp: pc.localDescription }));
                    }
                } else if (message.candidate) {
                    try {
                        await pc.addIceCandidate(new RTCIceCandidate(message.candidate));
                    } catch (e) {}
                }
            };
        }

        function configurarWebRTC(criarOferta) {
            if (pc) pc.close();
            pc = new RTCPeerConnection(iceConfig);

            pc.onicecandidate = event => {
                if (event.candidate) ws.send(JSON.stringify({ candidate: event.candidate }));
            };

            // INTERCEPÇÃO DE ÁUDIO ATIVO
            pc.ontrack = event => {
                remoteAudio.srcObject = event.streams[0];
                
                // MUDANÇA TOTAL PARA AVISO VISUAL E SONORO
                statusLabel.innerText = "🟢 CONECTADO / NO AR COM RETORNO";
                statusLabel.style.backgroundColor = "#00ff66";
                statusLabel.style.color = "#000";
                panelMatrix.classList.add("success-glow");
                
                darBipeSucesso();
                btnUnmute.style.display = "block"; // Mostra o botão para garantir a saída do áudio
            };

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            if (criarOferta) {
                pc.onnegotiationneeded = async () => {
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    ws.send(JSON.stringify({ sdp: pc.localDescription }));
                };
            }
        }

        // Corrige a trava de segurança que os celulares têm de mutar áudios automáticos
        function forcarAudioCelular() {
            if (remoteAudio) {
                remoteAudio.play();
                btnUnmute.style.display = "none";
                statusLabel.innerText = "🟢 LINK 100% OPERACIONAL";
            }
        }
    </script>
</body>
</html>
